server:
  port: ${WEBHOOK_COLLECTOR_SERVICE_SERVER_PORT:8088}

keycloak:
  host: ${KEYCLOAK_HOST:http://localhost:8080}
  realm: ${KEYCLOAK_REALM:payment-system}

spring:
  application:
    name: ${WEBHOOK_COLLECTOR_SERVICE_SPRING_APPLICATION_NAME:webhook-collector-service}
  main:
    banner-mode: off
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5440}/webhook_collector_service
    username: ${POSTGRES_USERNAME:admin}
    password: ${POSTGRES_PASSWORD:admin}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[enable.idempotence]": "true"
        spring.json.add.type.headers: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      org.hibernate:
        envers:
          autoRegisterListeners: true
          audit_table_suffix: _history
          default_schema: person_history
          store_data_at_delete: true
          revision_field_name: revision
          revision_type_field_name: revision_type
      hibernate:
        default_schema: person
        show_sql: ${SHOW_SQL:true}
        format_sql: ${FORMAT_SQL:true}
        highlight_sql: ${HIGHLIGHT_SQL:true}
        session.events.log.LOG_QUERIES_SLOWER_THAN_MS: ${SLOW_SQL_QUERY_INDICATOR_MS:1500}
        hbm2ddl:
          auto: validate
    driver-class-name: org.postgresql.Driver

management:
  server:
    port: ${server.port}
  endpoints:
    web:
      exposure:
        include: ${WEBHOOK_COLLECTOR_SERVICE_MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:*}
  endpoint:
    health:
      show-details: ${WEBHOOK_COLLECTOR_SERVICE_MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}
    prometheus:
      access: ${WEBHOOK_COLLECTOR_SERVICE_MANAGEMENT_ENDPOINT_PROMETHEUS_ACCESS:read_only}
  tracing:
    sampling:
      probability: '1.0'

otel:
  exporter:
    otlp:
      endpoint: ${WEBHOOK_COLLECTOR_SERVICE_OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
      protocol: http/protobuf
  logs:
    exporter: none
  metrics:
    exporter: none

kafka:
  topic:
    transaction-service:
      transaction:
        read:
          name: ${KAFKA_TOPIC_TRANSACTION_SERVICE_READ_NAME:transaction-read}

webhook:
  secret-key: ${WEBHOOK_COLLECTOR_FAKE_PAYMENT_PROVIDER_WEBHOOK_SECRET_KEY:abrakadabra4224}

scheduling:
  transaction_outbox:
    event-rate: ${WEBHOOK_COLLECTOR_SCHEDULING_TRANSACTIONAL_OUTBOX_EVENT_RATE:2000} #2 sec